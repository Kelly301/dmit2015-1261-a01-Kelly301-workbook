<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:p="primefaces">

<f:view>
  <h:head>
    <title>Fall 2026 Course Registration Form</title>
  </h:head>

  <h:body>
    <h2>Fall 2026 Course Registration Form</h2>

    <h:form>
      <p:messages showDetail="true"/>

      <p:panel header="Student Registration Form">
        <p:outputLabel
                for="studentName"
                value="Student Name:"/>

        <br/>

        <p:inputText
                id="studentName"
                value="#{courseRegistrationBean.studentName}"
                required="true"
                requiredMessage="Student name is required"/>

        <br/><br/>

        <p:outputLabel
          for="email"
          value="Email Address:"/>

        <br/>

        <p:inputText
          id="email"
          value="#{courseRegistrationBean.emailAddress}"
          required="true"
          requiredMessage="Email Address is required"/>

        <br/><br/>

        <p:outputLabel
          for="courseName"
          value="Course Name:"/>

        <br/>

        <p:selectOneMenu
          id="courseName"
          value="#{courseRegistrationBean.courseName}">

          <f:selectItem
            itemLabel="Select a Course"
            itemValue=""/>

          <f:selectItem
            itemLabel="DMIT2015"
            itemValue="DMIT2015"/>

          <f:selectItem
                  itemLabel="CPSC1517"
                  itemValue="CPSC1517"/>

          <f:selectItem
                  itemLabel="SDEV2301"
                  itemValue="SDEV2301"/>


          <f:selectItem
                  itemLabel="DMIT2504"
                  itemValue="DMIT2504"/>

        </p:selectOneMenu>

        <br/><br/>

        <p:selectBooleanCheckbox
            value="#{courseRegistrationBean.onlineDelivery}"/>
        <h:outputText
          value=" Online Delivery"/>

        <br/><br/>

        <p:commandButton
          value="Submit Registration"
          action="#{courseRegistrationBean.submit()}"
          update="@form"/>

      </p:panel>
    </h:form>

    <br/><br/>

    <h:outputText value="Powered by Jakarta Faces + PrimeFaces" />

  </h:body>
</f:view>
</html>
