<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:p="primefaces">
<f:view>
  <h:head>
    <title>Course Registration</title>
  </h:head>

  <h:body>
    <h2>DMIT2015 Course Registration</h2>

    <h:form>
      <p:messages id="messages"/>

      <p:panel header="Student Registration Form">
        <p:outputLabel
                for="studentName"
                value="Student Name:"/>

        <br/>

        <p:inputText
                id="studentName"
                value="#{courseRegistrationBean.studentName}"
                required="true"
                requiredMessage="Student name is required"/>

        <br/><br/>


      </p:panel>
    </h:form>
  </h:body>
</f:view>
</html>
