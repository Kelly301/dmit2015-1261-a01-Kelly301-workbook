<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html">

    <h:head>
        <title>DMIT2015 JSF Demo</title>
    </h:head>
    <h:body>
        <h2>DMIT2015 Jakarta Faces Demo</h2>

        <h:form>
            <h:messages />

            <h:inputText
                value="#{greetingBean.firstName}" />

            <h:commandButton
                value="Submit" />

            <br />
            <br />

            <h:outputText
                value="#{greetingBean.greetingMessage}" />

            <h:outputText value="Apache Tomcat + Jakarta Faces" />
        </h:form>
    </h:body>

</html>
